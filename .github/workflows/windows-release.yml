name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_single_file_portable:
        description: 'Build the legacy single-file portable exe'
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.CSC_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Build recommended Windows artifacts
        run: npm.cmd run package:win

      - name: Build legacy single-file portable exe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_single_file_portable }}
        run: npm.cmd run package:portable:single

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*-portable-dir.zip
            release/*-portable-single.exe
            release/*-setup.exe
            release/*-setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Verify Chinese release notes file
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $releaseNotesPath = "docs/RELEASE_NOTES_${tagName}.md"
          if (-not (Test-Path $releaseNotesPath)) {
            throw "缺少 release notes 文件：$releaseNotesPath。请先补充对应版本的中文发布说明。"
          }
          "RELEASE_NOTES_PATH=$releaseNotesPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: |
            release/*-portable-dir.zip
            release/*-portable-single.exe
            release/*-setup.exe
            release/*-setup.exe.blockmap
            release/latest.yml
